<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #1a1a2e 0%, #050508 100%);
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        h1 {
            color: #ffffff;
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            animation: pulse 1s ease-in-out infinite alternate, shake 0.2s infinite;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff0055, 0 0 30px #ff0055;
        }

        @keyframes pulse {
            from { transform: scale(1); filter: hue-rotate(0deg); }
            to { transform: scale(1.1); filter: hue-rotate(360deg); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: move linear infinite;
        }

        @keyframes move {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NO MORE ISRAELGPT YAHOO!</h1>
    </div>

    <script>
        function spawnParticles() {
            for (let i = 0; i < 70; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const colors = ['#ff0055', '#00fbff', '#ffff00', '#ff00ff', '#ffffff'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.top = '100vh';
                p.style.animationDuration = (Math.random() * 2 + 1) + 's';
                p.style.delay = Math.random() * 2 + 's';
                document.body.appendChild(p);
            }
        }
        spawnParticles();
    </script>
</body>
</html>
